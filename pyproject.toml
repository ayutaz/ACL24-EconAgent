[project]
name = "acl24-econagent"
version = "0.1.0"
description = "EconAgent: LLM-Empowered Agents for Simulating Macroeconomic Activities (ACL 2024)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fire>=0.5",
    "lz4>=4.0",
    "matplotlib>=3.7",
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "seaborn>=0.12",
]

[project.optional-dependencies]
gpt = [
    "openai>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_economist"]
